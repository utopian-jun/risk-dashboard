name: Update Market Data

# 매일 오전 7시(KST) = UTC 22:00 자동 실행 + 수동 실행 버튼 제공
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

# market_data.json 커밋/푸시를 위해 쓰기 권한 부여
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data updater
        run: python data_updater.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없습니다 — 커밋 생략."
          else
            git commit -m "chore: update market_data.json [skip ci]"
            git push
          fi
